<svg class="cockpit-canopy-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="hullDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="85%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="pillarLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="pillarRightGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <linearGradient id="glassSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="35%" stop-color="rgba(56, 189, 248, 0.03)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Bevel drop shadow -->
    <filter id="cockpitBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- ==============================================
       1. CANOPY SOLID HULL (Panoramic Wide Window Cutouts)
       ============================================== -->
  <g class="canopy-hull" filter="url(#cockpitBevel)">
    
    <!-- Top Roof Console & Ceiling Header (Extended Widescreen Cutouts) -->
    <polygon points="0,0 1920,0 1920,150 1680,150 1650,110 1060,110 1030,150 890,150 860,110 270,110 240,150 0,150" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Center Overhead Console (Between Skylights) -->
    <polygon points="860,0 1060,0 1040,160 880,160" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Overhead status lights & vents -->
    <rect x="910" y="30" width="100" height="8" rx="2" fill="#1e293b" />
    <circle cx="930" cy="65" r="4" fill="#38bdf8" opacity="0.9" />
    <circle cx="950" cy="65" r="4" fill="#4ade80" opacity="0.9" />
    <circle cx="970" cy="65" r="4" fill="#f59e0b" opacity="0.9" />
    <circle cx="990" cy="65" r="4" fill="#ef4444" opacity="0.9" />
    <rect x="900" y="90" width="120" height="3" fill="#38bdf8" opacity="0.6" />

    <!-- Left Outer Wall & Slim A-Pillar (Pushed Outward for Wide Space View) -->
    <polygon points="0,150 160,150 120,760 0,760" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="140,150 260,150 220,760 100,760" fill="url(#pillarLeftGrad)" stroke="#334155" stroke-width="2" />
    <!-- Left A-Pillar Cyan LED Accent Strip -->
    <line x1="220" y1="160" x2="180" y2="740" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="drop-shadow(0 0 6px #38bdf8)" />
    <line x1="160" y1="180" x2="120" y2="740" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Right Outer Wall & Slim A-Pillar (Pushed Outward for Wide Space View) -->
    <polygon points="1760,150 1920,150 1920,760 1800,760" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="1660,150 1780,150 1820,760 1700,760" fill="url(#pillarRightGrad)" stroke="#334155" stroke-width="2" />
    <!-- Right A-Pillar Cyan LED Accent Strip -->
    <line x1="1700" y1="160" x2="1740" y2="740" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="drop-shadow(0 0 6px #38bdf8)" />
    <line x1="1760" y1="180" x2="1800" y2="740" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Top Windshield Cowling Arch (Widescreen Span) -->
    <path d="M 240,150 Q 960,170 1680,150 L 1660,170 Q 960,190 260,170 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />

    <!-- Window Sill Bottom Crossbeam -->
    <polygon points="0,740 1920,740 1920,780 0,780" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="742" x2="1920" y2="742" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- ==============================================
       2. WINDOW GLASS SPECULAR & TINT OVERLAYS
       ============================================== -->
  <g class="canopy-glass" pointer-events="none">
    <!-- Front Viewport Glass Sheen (Panoramic Span) -->
    <polygon points="260,170 1660,170 1700,740 220,740" fill="url(#glassSheenGrad)" opacity="0.6" />
    <!-- Subtle Reflection Streaks across windshield -->
    <path d="M 320,180 L 580,180 L 440,680 L 280,680 Z" fill="rgba(255, 255, 255, 0.03)" />
    <path d="M 1320,180 L 1460,180 L 1620,680 L 1520,680 Z" fill="rgba(56, 189, 248, 0.025)" />

    <!-- Left Side Window Glass -->
    <polygon points="20,160 140,160 100,690 15,690" fill="url(#glassSheenGrad)" opacity="0.5" />
    
    <!-- Right Side Window Glass -->
    <polygon points="1780,160 1900,160 1905,690 1820,690" fill="url(#glassSheenGrad)" opacity="0.5" />

    <!-- Overhead Skylights Glass (Widescreen) -->
    <polygon points="280,20 850,20 830,105 250,105" fill="url(#glassSheenGrad)" opacity="0.4" />
    <polygon points="1070,20 1640,20 1670,105 1090,105" fill="url(#glassSheenGrad)" opacity="0.4" />
  </g>
</svg>
