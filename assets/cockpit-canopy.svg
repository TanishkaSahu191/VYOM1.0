<svg class="cockpit-canopy-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="hullDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="85%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="pillarLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="pillarRightGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <linearGradient id="glassSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="35%" stop-color="rgba(56, 189, 248, 0.03)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Bevel drop shadow -->
    <filter id="cockpitBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- ==============================================
       1. CANOPY SOLID HULL (Maximized Vertical & Horizontal Screen Window)
       ============================================== -->
  <g class="canopy-hull" filter="url(#cockpitBevel)">
    
    <!-- Top Roof Console & Ceiling Header (Slim Compact Header) -->
    <polygon points="0,0 1920,0 1920,80 1720,80 1690,55 1060,55 1030,80 890,80 860,55 230,55 200,80 0,80" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Center Overhead Console (Between Skylights) -->
    <polygon points="880,0 1040,0 1025,90 895,90" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Overhead status lights & vents -->
    <rect x="915" y="15" width="90" height="6" rx="2" fill="#1e293b" />
    <circle cx="935" cy="40" r="3.5" fill="#38bdf8" opacity="0.9" />
    <circle cx="955" cy="40" r="3.5" fill="#4ade80" opacity="0.9" />
    <circle cx="975" cy="40" r="3.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="995" cy="40" r="3.5" fill="#ef4444" opacity="0.9" />
    <rect x="910" y="58" width="100" height="2.5" fill="#38bdf8" opacity="0.6" />

    <!-- Left Outer Wall & Slim A-Pillar (Extended to Dashboard Sill) -->
    <polygon points="0,80 140,80 100,885 0,885" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="120,80 220,80 180,885 80,885" fill="url(#pillarLeftGrad)" stroke="#334155" stroke-width="2" />
    <!-- Left A-Pillar Cyan LED Accent Strip -->
    <line x1="190" y1="90" x2="150" y2="870" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="drop-shadow(0 0 6px #38bdf8)" />
    <line x1="140" y1="100" x2="100" y2="870" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Right Outer Wall & Slim A-Pillar (Extended to Dashboard Sill) -->
    <polygon points="1780,80 1920,80 1920,885 1820,885" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="1700,80 1800,80 1840,885 1740,885" fill="url(#pillarRightGrad)" stroke="#334155" stroke-width="2" />
    <!-- Right A-Pillar Cyan LED Accent Strip -->
    <line x1="1730" y1="90" x2="1770" y2="870" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="drop-shadow(0 0 6px #38bdf8)" />
    <line x1="1780" y1="100" x2="1820" y2="870" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Top Windshield Cowling Arch (Elevated for Taller Vertical Screen) -->
    <path d="M 200,80 Q 960,95 1720,80 L 1700,95 Q 960,110 220,95 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />

    <!-- Window Sill Bottom Crossbeam (Lowered for Lengthened Screen Viewport) -->
    <polygon points="0,875 1920,875 1920,905 0,905" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="877" x2="1920" y2="877" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- ==============================================
       2. WINDOW GLASS SPECULAR & TINT OVERLAYS
       ============================================== -->
  <g class="canopy-glass" pointer-events="none">
    <!-- Front Viewport Glass Sheen (Lengthened Panoramic Span) -->
    <polygon points="220,95 1700,95 1740,875 180,875" fill="url(#glassSheenGrad)" opacity="0.6" />
    <!-- Subtle Reflection Streaks across windshield -->
    <path d="M 280,105 L 540,105 L 400,830 L 240,830 Z" fill="rgba(255, 255, 255, 0.03)" />
    <path d="M 1380,105 L 1520,105 L 1680,830 L 1580,830 Z" fill="rgba(56, 189, 248, 0.025)" />

    <!-- Left Side Window Glass -->
    <polygon points="15,85 120,85 80,840 10,840" fill="url(#glassSheenGrad)" opacity="0.5" />
    
    <!-- Right Side Window Glass -->
    <polygon points="1800,85 1905,85 1910,840 1840,840" fill="url(#glassSheenGrad)" opacity="0.5" />

    <!-- Overhead Skylights Glass (Widescreen) -->
    <polygon points="240,15 850,15 830,50 210,50" fill="url(#glassSheenGrad)" opacity="0.4" />
    <polygon points="1070,15 1680,15 1710,50 1090,50" fill="url(#glassSheenGrad)" opacity="0.4" />
  </g>
</svg>
