<svg class="cockpit-canopy-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="hullDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="85%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="pillarLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="pillarRightGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <linearGradient id="glassSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="35%" stop-color="rgba(56, 189, 248, 0.03)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Bevel drop shadow -->
    <filter id="cockpitBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- ==============================================
       1. CANOPY SOLID HULL (Cutouts for Windows)
       ============================================== -->
  <g class="canopy-hull" filter="url(#cockpitBevel)">
    
    <!-- Top Roof Console & Ceiling Header -->
    <polygon points="0,0 1920,0 1920,150 1480,150 1450,110 1060,110 1030,150 890,150 860,110 470,110 440,150 0,150" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Center Overhead Console (Between Skylights) -->
    <polygon points="860,0 1060,0 1040,160 880,160" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Overhead status lights & vents -->
    <rect x="910" y="30" width="100" height="8" rx="2" fill="#1e293b" />
    <circle cx="930" cy="65" r="4" fill="#38bdf8" opacity="0.9" />
    <circle cx="950" cy="65" r="4" fill="#4ade80" opacity="0.9" />
    <circle cx="970" cy="65" r="4" fill="#f59e0b" opacity="0.9" />
    <circle cx="990" cy="65" r="4" fill="#ef4444" opacity="0.9" />
    <rect x="900" y="90" width="120" height="3" fill="#38bdf8" opacity="0.6" />

    <!-- Left Outer Wall & A-Pillar Structural Beam -->
    <!-- Connects from roof down to dashboard -->
    <polygon points="0,150 320,150 260,760 0,760" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="260,150 460,150 400,760 200,760" fill="url(#pillarLeftGrad)" stroke="#334155" stroke-width="2" />
    <!-- Left A-Pillar Cyan LED Accent Strip -->
    <line x1="390" y1="160" x2="330" y2="740" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="drop-shadow(0 0 6px #38bdf8)" />
    <line x1="280" y1="180" x2="220" y2="740" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Right Outer Wall & A-Pillar Structural Beam -->
    <polygon points="1600,150 1920,150 1920,760 1660,760" fill="url(#hullDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="1460,150 1660,150 1720,760 1520,760" fill="url(#pillarRightGrad)" stroke="#334155" stroke-width="2" />
    <!-- Right A-Pillar Cyan LED Accent Strip -->
    <line x1="1530" y1="160" x2="1590" y2="740" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="drop-shadow(0 0 6px #38bdf8)" />
    <line x1="1640" y1="180" x2="1700" y2="740" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6" opacity="0.5" />

    <!-- Top Windshield Cowling Arch -->
    <path d="M 440,150 Q 960,175 1480,150 L 1460,170 Q 960,195 460,170 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />

    <!-- Window Sill Bottom Crossbeam -->
    <polygon points="0,740 1920,740 1920,780 0,780" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="742" x2="1920" y2="742" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- ==============================================
       2. WINDOW GLASS SPECULAR & TINT OVERLAYS
       ============================================== -->
  <g class="canopy-glass" pointer-events="none">
    <!-- Front Viewport Glass Sheen -->
    <polygon points="460,170 1460,170 1520,740 400,740" fill="url(#glassSheenGrad)" opacity="0.6" />
    <!-- Subtle Reflection Streaks across windshield -->
    <path d="M 520,180 L 780,180 L 640,680 L 480,680 Z" fill="rgba(255, 255, 255, 0.03)" />
    <path d="M 1120,180 L 1260,180 L 1420,680 L 1320,680 Z" fill="rgba(56, 189, 248, 0.025)" />

    <!-- Left Side Window Glass -->
    <polygon points="40,160 260,160 200,690 30,690" fill="url(#glassSheenGrad)" opacity="0.5" />
    
    <!-- Right Side Window Glass -->
    <polygon points="1660,160 1880,160 1890,690 1720,690" fill="url(#glassSheenGrad)" opacity="0.5" />

    <!-- Overhead Skylights Glass -->
    <polygon points="480,20 850,20 830,105 450,105" fill="url(#glassSheenGrad)" opacity="0.4" />
    <polygon points="1070,20 1440,20 1470,105 1090,105" fill="url(#glassSheenGrad)" opacity="0.4" />
  </g>
</svg>
