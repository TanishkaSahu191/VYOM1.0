<svg class="cockpit-yoke-svg" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yokeMatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="90%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="gripTextureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="yokeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#yokeGlow)">
    <!-- Steering Central Column Mounting Pylon -->
    <rect x="145" y="110" width="30" height="90" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <line x1="160" y1="120" x2="160" y2="190" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

    <!-- Steering Butterfly Crossbar -->
    <path d="M 40,65 Q 160,85 280,65 L 290,105 Q 160,135 30,105 Z" fill="url(#yokeMatGrad)" stroke="#475569" stroke-width="2" />

    <!-- Left Ergonomic Pilot Handgrip -->
    <path d="M 25,40 Q 55,20 60,65 L 50,140 Q 45,170 20,150 Q 5,120 15,65 Z" fill="url(#gripTextureGrad)" stroke="#090d16" stroke-width="2" />
    <!-- Grip finger grooves -->
    <line x1="18" y1="80" x2="48" y2="85" stroke="#334155" stroke-width="2" />
    <line x1="18" y1="100" x2="45" y2="105" stroke="#334155" stroke-width="2" />
    <line x1="20" y1="120" x2="42" y2="125" stroke="#334155" stroke-width="2" />
    <!-- Left Thumb Rocker Switch & Cyan Trigger -->
    <circle cx="50" cy="50" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="18" y="42" width="6" height="12" rx="2" fill="#38bdf8" />

    <!-- Right Ergonomic Pilot Handgrip -->
    <path d="M 295,40 Q 265,20 260,65 L 270,140 Q 275,170 300,150 Q 315,120 305,65 Z" fill="url(#gripTextureGrad)" stroke="#090d16" stroke-width="2" />
    <!-- Grip finger grooves -->
    <line x1="302" y1="80" x2="272" y2="85" stroke="#334155" stroke-width="2" />
    <line x1="302" y1="100" x2="275" y2="105" stroke="#334155" stroke-width="2" />
    <line x1="300" y1="120" x2="278" y2="125" stroke="#334155" stroke-width="2" />
    <!-- Right Thumb Rocker Switch & Cyan Trigger -->
    <circle cx="270" cy="50" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="296" y="42" width="6" height="12" rx="2" fill="#38bdf8" />

    <!-- Central Hub Badge (VYOM Aerospace Emblem) -->
    <circle cx="160" cy="95" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="160" cy="95" r="20" fill="#020617" />
    <!-- Stylized V Crest -->
    <path d="M 148,87 L 160,105 L 172,87" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="160" cy="85" r="2.5" fill="#38bdf8" />
  </g>
</svg>
