<svg class="cockpit-seat-svg" viewBox="0 0 420 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="seatShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="leatherPadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="metalPylonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="seatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#seatGlow)">
    <!-- 1. HEADREST MOUNTING PYLONS (Brushed Titanium Rods) -->
    <rect x="175" y="100" width="14" height="60" rx="4" fill="url(#metalPylonGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="235" y="100" width="14" height="60" rx="4" fill="url(#metalPylonGrad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- 2. ERGONOMIC CONTOURED HEADREST -->
    <g class="seat-headrest">
      <!-- Outer Shell -->
      <path d="M 140,40 Q 210,20 280,40 Q 300,55 295,95 Q 290,125 210,130 Q 130,125 125,95 Q 120,55 140,40 Z" fill="url(#seatShellGrad)" stroke="#334155" stroke-width="2" />
      <!-- Center Cushion -->
      <path d="M 155,50 Q 210,35 265,50 Q 275,65 272,95 Q 268,115 210,118 Q 152,115 148,95 Q 145,65 155,50 Z" fill="url(#leatherPadGrad)" stroke="#020617" stroke-width="1.5" />
      <!-- Cyan Accent Piping -->
      <path d="M 145,95 Q 210,125 275,95" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" filter="drop-shadow(0 0 4px #38bdf8)" />
    </g>

    <!-- 3. SHOULDER WINGS / UPPER BACKREST HULL -->
    <path d="M 150,150 L 270,150 L 370,240 Q 390,320 370,420 L 320,680 L 100,680 L 50,420 Q 30,320 50,240 Z" fill="url(#seatShellGrad)" stroke="#1e293b" stroke-width="2" />

    <!-- 4. INNER ERGONOMIC CONTOURS & BOLSTERS -->
    <!-- Left Shoulder Bolster -->
    <path d="M 70,250 Q 55,330 75,410 L 115,410 Q 105,330 115,250 Z" fill="url(#leatherPadGrad)" stroke="#090d16" stroke-width="1.5" />
    <!-- Right Shoulder Bolster -->
    <path d="M 350,250 Q 365,330 345,410 L 305,410 Q 315,330 305,250 Z" fill="url(#leatherPadGrad)" stroke="#090d16" stroke-width="1.5" />

    <!-- Spine Cushion Pads -->
    <rect x="135" y="170" width="150" height="75" rx="8" fill="url(#leatherPadGrad)" stroke="#090d16" stroke-width="1.5" />
    <rect x="130" y="260" width="160" height="90" rx="8" fill="url(#leatherPadGrad)" stroke="#090d16" stroke-width="1.5" />
    <rect x="125" y="365" width="170" height="110" rx="8" fill="url(#leatherPadGrad)" stroke="#090d16" stroke-width="1.5" />
    <rect x="120" y="490" width="180" height="150" rx="8" fill="url(#leatherPadGrad)" stroke="#090d16" stroke-width="1.5" />

    <!-- 5. AEROSPACE FLIGHT HARNESS STRAPS -->
    <path d="M 145,150 L 140,360 L 155,360 L 160,150 Z" fill="#0b111e" stroke="#334155" stroke-width="1" />
    <path d="M 275,150 L 280,360 L 265,360 L 260,150 Z" fill="#0b111e" stroke="#334155" stroke-width="1" />
    <!-- Harness Buckle Center Hub -->
    <circle cx="210" cy="380" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="210" cy="380" r="8" fill="#38bdf8" opacity="0.8" />

    <!-- Cyan Decorative Seam Highlights -->
    <path d="M 60,240 Q 40,330 60,420" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75" />
    <path d="M 360,240 Q 380,330 360,420" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75" />
  </g>
</svg>
